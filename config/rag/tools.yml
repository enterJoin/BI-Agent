tools:
  - name: artifact_search
    description: "按模块、文件、符号类型、业务词或代码词批量查找代码制品，包括类、方法、配置、Entity、Mapper、表、字段、XML、SQL。"
    capabilities:
      - symbol_lookup
      - file_lookup
      - entity_lookup
      - mapper_lookup
      - config_lookup
      - table_lookup
    requires:
      - project_id

  - name: relation_search
    description: "围绕已命中的类、方法、任务入口、接口或持久化点，批量查询调用、包含、依赖、读写等关系。"
    capabilities:
      - relation_lookup
      - caller_lookup
      - callee_lookup
      - impact_trace
      - dependency_trace
    requires:
      - project_id

  - name: aggregate_query
    description: "对已查到的证据和关系型索引做批量聚合，例如按模块汇总表、按阶段汇总执行流、按表汇总字段和写入点。"
    capabilities:
      - table_aggregation
      - flow_aggregation
      - field_mapping
      - evidence_summarization
    requires:
      - project_id

  - name: source_read
    description: "在项目路径存在且允许读取源码时，读取证据对应的源码片段。"
    capabilities:
      - source_reading
    requires:
      - project_path
      - source_available
