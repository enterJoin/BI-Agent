services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: springgraph-postgres
    environment:
      POSTGRES_DB: springgraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d springgraph"]
      interval: 2s
      timeout: 2s
      retries: 20
